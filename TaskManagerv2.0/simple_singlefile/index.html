<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SIMPLE_TODO</title>
        <link rel="stylesheet" href="styles.css">
        <script src="functions.js"></script>
    </head>
    
<body>
    <div class="homePage">
        <div class="homeMain">
            <h3 class="mainText">WELCOME!!</h3>
            <button class="homeItem" type="button" id="addTask" onclick="addTask()">Add Task</button>
            <button class="homeItem" type="button" id="hideFinish" onclick="clearAll()">Clear All</button>
            <button class="homeItem" type="button" id="hideFinish" onclick="toggleFinished()">Hide Finished</button>
        </div>

        <div class="homeMain actionBox" id="actionBox">
            <input class="homeItem textBox" placeholder="New task">
            <button class="homeItem" type="button" onclick="Accept()">Accept</button>
            <button  class="homeItem" type="button" onclick="cancelAction()">Cancel</button>
        </div>
        
        <div class="homeMain">
            <div class="openTasks"></div>
            <div class="doneTaskList">
                <p><br></p>
            </div>
            <div class="closedTasks"></div>
        </div>
    </div>
</body>
</html>
