<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SIMPLE_TODO</title>
        <link rel="stylesheet" href="styles.css">
        <script src="functions.js"></script>
    </head>
    
<body>
    <div class="homePage">
        <div class="homeMain">
            <h3 class="greeting" id="greeting">WELCOME!!</h3>
            <button class="homeBtn" type="button" id="addTask" onclick="addTask()">Add Task</button>
            <button class="homeBtn" type="button" id="hideFinish" onclick="toggleFinished()">Hide Finished</button>
            <button class="homeBtn" type="button" id="hideFinish" onclick="clearAll()">Clear All</button>
        </div>
        <div class="taskBox">
            <input id="task" placeholder="New task">
            <button onclick="Accept()">Accept</button>
            <button onclick="Cancel()">Cancel</button>
        </div>
        <div class="classList">
        </div>
    </div>
</body>
</html>
