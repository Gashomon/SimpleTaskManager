<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SIMPLE_TODO</title>
        <link rel="stylesheet" href="styles.css">
        <script src="functions.js"></script>
    </head>
    
<body>
    <div class="homePage">
        <div class="homeMain">
            <h3 class="mainText">WELCOME!!</h3>
            <button class="homeItem" type="button" id="addTask" onclick="addTask()">Add Task</button>
            <button class="homeItem" type="button" id="clearAll" onclick="deleteAllTask()">Clear All</button>
            <button class="homeItem" type="button" id="hideFinished" onclick="toggleFinished()">Hide Finished</button>
        </div>

        <div class="homeMain actionBox" id="actionBox">
            <input class="homeItem textBox" id="inputText" placeholder="New task">
            <button class="homeItem" id="actionButton" type="button" onclick="acceptAction()">Accept</button>
            <button  class="homeItem" type="button" onclick="cancelAction()">Cancel</button>
        </div>
        
        <div class="homeMain mainList">
            <div class="taskList" id="openTasks"></div>
            <div class="taskList">
                <p><br></p>
            </div>
            <div class="TaskList" id="doneTasks"></div>
        </div>
    </div>
</body>
<script>
    cancelAction()
    loadTasks()
</script>
</html>
